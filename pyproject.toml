[project]
name = "cas"
version = "0.1.0"
description = ""
authors = [
    {name = "Mike Brennan",email = "mike.brennan91@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit (>=1.67.0,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "openai (>=3.46.0,<4.0.0)",
    "polars (>=2.1.0,<3.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
]

[tool.poetry]
packages = [{include = "cas", from = "src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
